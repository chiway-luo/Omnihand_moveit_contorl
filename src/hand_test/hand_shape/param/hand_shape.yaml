hand_shape:
  ros__parameters:
    # 当前激活的手型名称 —— 通过 ros2 param set 修改此值即可切换手型
    # 用法: ros2 param set /hand_shape current_shape catch
    current_shape: "default"

    # 预设手型定义 (单位: 度)
    # 10个关节顺序: thumb_roll, thumb_abad, thumb_mcp,
    #              index_abad, index_pip, middle_pip,
    #              ring_abad, ring_pip, pinky_abad, pinky_pip
    presets:
      default: [-30.0, 1.0, 0.0, 4.9, 0.0, 0.0, -4.9, 0.0, -5.4, 0.0]
      catch:   [-18.44, 52.60, -28.96, 10.0, 30.0, 30.0, -5.0, 30.0, -5.0, 30.0]
      full:    [-50.0, 100.0, -49.0, 12.0, 90.0, 90.0, -10.0, 90.0, -10.0, 90.0]
      pinch:   [-10.0, 60.0, -30.0, 4.9, 45.0, 0.0, -4.9, 0.0, -5.4, 0.0]
      point:   [-30.0, 80.0, -40.0, 4.9, 0.0, 80.0, -10.0, 80.0, -10.0, 80.0]
      joke:    [-30.24, 73.99, -47.71, 4.92, 84.57, 0.74, -4.96, 84.56, -5.24, 84.57]
